<style>
/* ── Design Tokens ── */
:root {
  --green-900: #1A5632;
  --green-700: #22753F;
  --green-500: #2D9B52;
  --green-300: #6FCF8D;
  --green-100: #C8F0D4;
  --green-50:  #F0FBF4;
  --neutral-900: #1B1B28;
  --neutral-700: #3A3A4A;
  --neutral-300: #B0B0BC;
  --neutral-100: #E8E8EC;
  --neutral-50:  #FAFAFA;
  --bubble-size: 88px;
  --expanded-w: 272px;
  --expanded-h: 340px;
  --border-w: 3px;
  --font-body: 'Work Sans', system-ui, -apple-system, sans-serif;
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  overflow: hidden;
  font-family: var(--font-body);
  background: #fff;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ── */
#careers-explorer {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 550px;
  background: radial-gradient(ellipse at 50% 40%, #ffffff 0%, var(--green-50) 100%);
  overflow: hidden;
  touch-action: pan-y;
}

/* ── Header — centered watermark title ── */
#header {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  pointer-events: none;
  user-select: none;
}
#header h1 {
  font-size: clamp(2rem, 5vw, 4.5rem);
  font-weight: 800;
  color: var(--green-900);
  letter-spacing: -0.03em;
  line-height: 1.1;
  text-align: center;
  opacity: 0.15;
  max-width: 9em; /* forces ~3 stacked lines: Sustainable / Technology / Careers */
}

/* ── Bubble Container ── */
#bubble-container {
  position: absolute;
  inset: 0;
}

/* ── Category Labels (floating text, no bubble) ── */
.cat-bubble {
  position: absolute;
  left: 0;
  top: 0;
  text-align: center;
  font-size: clamp(1.4rem, 3vw, 2.5rem);
  font-weight: 700;
  color: var(--green-900);
  opacity: 0.65;
  pointer-events: none;
  user-select: none;
  z-index: 4;
  will-change: transform;
  line-height: 1.2;
  overflow-wrap: break-word;
  word-break: break-word;
  transform: translate(-50%, -50%);
  transition: opacity 0.3s ease;
}
.cat-bubble.cat-hidden {
  opacity: 0;
}

/* ── Bubble Wrapper (positioned by JS) ── */
.bw {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 1;
  will-change: transform;
  transition: opacity 0.4s ease;
}
.bw.is-expanded {
  z-index: 500;
}
.bw.card-moving {
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
}
.bw.is-hidden {
  opacity: 0;
  pointer-events: none;
}

/* ── Bubble ── */
.bubble {
  position: relative;
  width: var(--bubble-size);
  height: var(--bubble-size);
  border-radius: 50%;
  border: var(--border-w) solid var(--cat-border, var(--green-700));
  overflow: hidden;
  cursor: pointer;
  background: var(--green-50);
  display: flex;
  flex-direction: column;
  scale: 1;
  transition:
    width 0.42s cubic-bezier(0.34, 1.56, 0.64, 1),
    height 0.42s cubic-bezier(0.34, 1.56, 0.64, 1),
    border-radius 0.32s ease,
    border-color 0.3s ease,
    box-shadow 0.3s ease,
    scale 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.bubble.expanded {
  width: var(--expanded-w);
  height: var(--expanded-h);
  border-radius: 18px;
  border-color: var(--cat-border, var(--green-700));
  box-shadow: 0 12px 48px rgba(26, 86, 50, 0.22), 0 2px 12px rgba(0,0,0,0.08);
}

/* ── Bubble Image ── */
.bubble-img {
  width: 100%;
  height: 100%;
  min-height: 0;
  flex-shrink: 0;
  object-fit: cover;
  display: block;
  pointer-events: none;
  transition: height 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
  background: var(--cat-bg, linear-gradient(135deg, var(--green-300), var(--green-500)));
}
.bubble.expanded .bubble-img {
  height: 130px;
  border-radius: 0;
}

/* ── Bubble Content ── */
.bubble-content {
  flex: 1;
  padding: 0;
  opacity: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: opacity 0.25s ease, padding 0.35s ease;
  min-height: 0;
}
.bubble.expanded .bubble-content {
  padding: 12px 16px 14px;
  opacity: 1;
  transition-delay: 0.12s;
}

.bubble-content h3 {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--green-900);
  line-height: 1.2;
  letter-spacing: -0.01em;
}
.bubble-content .desc {
  font-size: 0.73rem;
  color: var(--neutral-700);
  line-height: 1.45;
  flex: 1;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
}
.bubble-content .meta {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: auto;
}
.meta-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.68rem;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 20px;
  white-space: nowrap;
}
.meta-tag.salary {
  background: var(--green-100);
  color: var(--green-900);
}
.meta-tag.edu {
  background: var(--neutral-100);
  color: var(--neutral-700);
}

/* ── Close Button ── */
.close-btn {
  position: absolute;
  top: 6px;
  right: 8px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.85);
  color: var(--neutral-700);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10;
  backdrop-filter: blur(4px);
  transition: background 0.2s;
}
.close-btn:hover { background: rgba(255,255,255,1); }
.bubble.expanded .close-btn { display: flex; }

/* ── Name Overlay (shown on desktop hover) ── */
.bubble-name {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 6%;
  font-size: clamp(0.7rem, 1.4vw, 0.95rem);
  font-weight: 600;
  color: #fff;
  background: rgba(26, 86, 50, 0.6);
  border-radius: 50%;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  line-height: 1.15;
  overflow: hidden;
  word-break: break-word;
  z-index: 2;
  font-family: var(--font-body);
}
.bubble.expanded .bubble-name { display: none; }

/* ── Desktop Hover Effects ── */
@media (hover: hover) {
  .bw:not(.is-expanded):hover {
    z-index: 100;
  }
  .bubble:not(.expanded):hover {
    border-color: var(--green-500);
    box-shadow: 0 4px 20px rgba(45, 155, 82, 0.22);
    scale: 1.22;
  }
  .bubble:not(.expanded):hover .bubble-name {
    opacity: 1;
  }
}

/* ── Overlay when expanded ── */
#overlay {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.35);
  z-index: 400;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  backdrop-filter: blur(1px);
}
#overlay.active {
  opacity: 1;
  pointer-events: auto;
}

/* ── Float Animation ── */
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-4px); }
}
.bubble:not(.expanded) {
  animation: float 5s ease-in-out infinite;
}
.bubble.expanded {
  animation: none;
}

/* ── Mobile ── */
@media (max-width: 600px) {
  .bubble-name { display: none; }
  .bubble.expanded .bubble-img { height: 100px; }
  .bubble-content .desc {
    -webkit-line-clamp: 3;
    font-size: 0.7rem;
  }
  .bubble-content h3 { font-size: 0.82rem; }
}

/* ── Category Filter Buttons ── */
#cat-filters {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 450;
  padding: 8px 12px;
  background: rgba(240, 251, 244, 0.82);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 100px;
  border: 1.5px solid rgba(26, 86, 50, 0.18);
  box-shadow: 0 4px 20px rgba(26, 86, 50, 0.13);
}
.cat-filter-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid var(--green-300);
  background: rgba(255, 255, 255, 0.7);
  color: var(--green-700);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  flex-shrink: 0;
  transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
}
.cat-filter-btn svg {
  width: 55%;
  height: 55%;
  display: block;
  pointer-events: none;
}
.cat-filter-btn:hover {
  background: var(--green-50);
  border-color: var(--green-500);
  transform: scale(1.08);
}
.cat-filter-btn.active {
  background: var(--green-700);
  border-color: var(--green-700);
  color: #fff;
  box-shadow: 0 2px 10px rgba(26, 86, 50, 0.32);
}
.cat-filter-btn.active:hover {
  background: var(--green-900);
  border-color: var(--green-900);
}

/* ── Accessibility ── */
.bubble:focus-visible {
  outline: 3px solid var(--green-500);
  outline-offset: 3px;
}
@media (prefers-reduced-motion: reduce) {
  .bubble, .bubble-img, .bubble-content, #overlay {
    transition-duration: 0.01ms !important;
    animation: none !important;
  }
}
</style>
</head>

    { title:'Energy and Infrastructure Sustainability', desc:'Develops strategies to reduce the environmental footprint of energy systems and digital infrastructure, from power plants to data centers.', salary:'$65K–$95K', edu:"Bachelor's", cat:'computing', img:'Images/energy-infrastructure-sustainability.jpg' },
    { title:'Software Engineer', desc:'Builds applications and tools that power clean energy platforms, environmental monitoring, and climate technology solutions.', salary:'$95K–$150K', edu:"Bachelor's", cat:'computing', img:'Images/software-engineer.jpg' },
    { title:'Sustainability Specialist', desc:'Analyzes an organization\'s environmental impact and recommends improvements across all operations.', salary:'$52K–$78K', edu:"Bachelor's", cat:'computing', img:'Images/sustainability-specialist.jpg' },
    { title:'UX Designer', desc:'Designs intuitive, user-centered interfaces for sustainability and cleantech platforms, making complex data clear and actionable.', salary:'$70K–$105K', edu:"Bachelor's", cat:'computing', img:'Images/ux-designer.jpg' }
  ];

  /* ── Category Config ── */
  var CAT_ORDER = ['energy','water','food','buildings','transportation','computing'];
  var CAT_LABELS = {
    energy:         'Energy',
    water:          'Water',
    food:           'Food',
    buildings:      'Buildings',
    transportation: 'Transportation',
    computing:      'Computing'
  };
  var catGradients = {
    energy:         'linear-gradient(135deg, #f59e0b 0%, #d97706 100%)',
    water:          'linear-gradient(135deg, #38bdf8 0%, #0284c7 100%)',
    food:           'linear-gradient(135deg, #4ade80 0%, #16a34a 100%)',
    buildings:      'linear-gradient(135deg, #94a3b8 0%, #475569 100%)',
    transportation: 'linear-gradient(135deg, #fb923c 0%, #ea580c 100%)',
    computing:      'linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%)'
  };

  /* Border colours per category (user-specified light tones) */
  var catColors = {
    energy:         '#fde68a',  // light yellow
    water:          '#bae6fd',  // light blue
    food:           '#bbf7d0',  // light green
    buildings:      '#fbcfe8',  // light pink
    transportation: '#ddd6fe',  // light purple
    computing:      '#f87171'   // saturated red
  };

  /* ── Dynamic Sizing ── */
  var NORMAL_R, HOVER_R, CAT_R, EXPANDED_R, PAD = 3;
  var catCenters = {};
  var catBubbleEls = {};
  var hasHover = window.matchMedia('(hover: hover)').matches;

  function calcSizes(w, h) {
    var vmin = Math.min(w, h);
    NORMAL_R = Math.max(24, Math.round(vmin / 15));
    HOVER_R = Math.round(NORMAL_R * 1.22);
    CAT_R = Math.max(24, Math.round(NORMAL_R * 0.7));
    var bsize = NORMAL_R * 2;

    var isMobile = w <= 600;
    var expW, expH;
    if (isMobile) {
      expW = 240;
      expH = 300;
    } else {
      // Scale up to 50% larger than minimum (240×300) on larger screens
      expW = Math.min(360, Math.max(240, Math.round(NORMAL_R * 5.5)));
      expH = Math.min(450, Math.max(300, Math.round(NORMAL_R * 7)));
    }
    // Physics radius: half card width + padding
    EXPANDED_R = Math.max(NORMAL_R * 2, Math.round(expW / 2) + 10);

    document.documentElement.style.setProperty('--bubble-size', bsize + 'px');
    document.documentElement.style.setProperty('--expanded-w', expW + 'px');
    document.documentElement.style.setProperty('--expanded-h', expH + 'px');
  }

  function layoutCatCenters(w, h, angleOffset) {
    var cx = w / 2;
    var cy = h / 2;
    var rx = w * 0.38;
    var ry = h * 0.36;
    var n = CAT_ORDER.length;
    var offset = angleOffset || 0;
    CAT_ORDER.forEach(function(cat, i) {
      var angle = (2 * Math.PI * i / n) - Math.PI / 2 + offset;
      catCenters[cat] = {
        x: cx + rx * Math.cos(angle),
        y: cy + ry * Math.sin(angle)
      };
    });
  }

  /* ── State ── */
  var nodes = [];
  var expandedNode = null;
  var running = false;
  var settled = false;
  var width, height, centerX, centerY;
  var rotationOffset = 0;
  var lastInteractionTime = 0;
  var hoverCount = 0;
  var catHoverCount = {}; // per-category hover counter for label visibility
  var IDLE_DELAY = 3500;      // ms before idle rotation begins
  var ROTATION_SPEED = 0.0007; // radians per frame (~150 s per full revolution at 60 fps)
  var filterCat = null;
  var filterNormalR = null; // enlarged bubble radius while filter is active
  var container = document.getElementById('bubble-container');
  var overlay   = document.getElementById('overlay');

  /* ── Create Category Labels (text-only, no circle) ── */
  function createCatBubbles() {
    CAT_ORDER.forEach(function(cat) {
      var el = document.createElement('div');
      el.className = 'cat-bubble';
      el.textContent = CAT_LABELS[cat];
      container.appendChild(el);
      catBubbleEls[cat] = el;
    });
  }

  function updateCatBubbles() {
    /* Constrain label width to cluster diameter (bubbles sit ~3 radii out) */
    var maxW = Math.round(NORMAL_R * 6) + 'px';
    CAT_ORDER.forEach(function(cat) {
      var cc = catCenters[cat];
      var el = catBubbleEls[cat];
      el.style.maxWidth = maxW;
      el.style.transform = 'translate(' + cc.x.toFixed(0) + 'px,' + cc.y.toFixed(0) + 'px) translate(-50%, -50%)';
    });
  }

  /* ── Create Bubble DOM ── */
  function createBubble(career, index) {
    var wrapper = document.createElement('div');
    wrapper.className = 'bw';
    wrapper.setAttribute('data-title', career.title);

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.setAttribute('role', 'button');
    bubble.setAttribute('tabindex', '0');
    bubble.setAttribute('aria-label', career.title);
    bubble.style.animationDelay = (index * 0.13 % 5).toFixed(2) + 's';

    /* Stamp the category border colour so CSS can reference it */
    bubble.style.setProperty('--cat-border', catColors[career.cat] || '#b0b0bc');

    var img = document.createElement('img');
    img.className = 'bubble-img';
    img.src = career.img;
    img.alt = career.title;
    img.loading = 'lazy';
    img.draggable = false;
    img.style.background = catGradients[career.cat] || catGradients.land;
    img.onerror = function() { this.style.display = 'none'; };

    var content = document.createElement('div');
    content.className = 'bubble-content';
    content.innerHTML =
      '<h3>' + career.title + '</h3>' +
      '<p class="desc">' + career.desc + '</p>' +
      '<div class="meta">' +
        '<span class="meta-tag salary">' + career.salary + '</span>' +
        '<span class="meta-tag edu">' + career.edu + '</span>' +
      '</div>';

    var closeBtn = document.createElement('button');
    closeBtn.className = 'close-btn';
    closeBtn.setAttribute('aria-label', 'Close');
    closeBtn.innerHTML = '&times;';
    closeBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      collapseExpanded();
    });

    var nameOverlay = document.createElement('span');
    nameOverlay.className = 'bubble-name';
    nameOverlay.textContent = career.title;

    bubble.appendChild(img);
    bubble.appendChild(nameOverlay);
    bubble.appendChild(content);
    bubble.appendChild(closeBtn);
    wrapper.appendChild(bubble);
    container.appendChild(wrapper);

    return { el: wrapper, bubble: bubble, career: career };
  }

  /* ── Initialize Nodes ── */
  function initNodes() {
    var rect = container.getBoundingClientRect();
    width   = rect.width;
    height  = rect.height;
    centerX = width / 2;
    centerY = height / 2;

    calcSizes(width, height);
    layoutCatCenters(width, height);
    createCatBubbles();
    updateCatBubbles();

    nodes = careers.map(function(career, i) {
      var cc = catCenters[career.cat];
      var angle = Math.random() * Math.PI * 2;
      var r = Math.random() * NORMAL_R * 3.5;
      var x = cc.x + r * Math.cos(angle);
      var y = cc.y + r * Math.sin(angle);

      var n = createBubble(career, i);
      n.x  = Math.max(NORMAL_R, Math.min(width - NORMAL_R, x));
      n.y  = Math.max(NORMAL_R, Math.min(height - NORMAL_R, y));
      n.vx = 0;
      n.vy = 0;
      n.radius = NORMAL_R;
      n.targetRadius = NORMAL_R;
      n.expanded = false;
      n.hidden = false;
      return n;
    });

    updatePositions();
  }

  /* ── Physics ── */
  function simulate() {
    if (!running) return;

    /* Idle rotation: advance cluster angle when no user activity */
    var now = Date.now();
    var isIdling = !expandedNode && hoverCount === 0 && (now - lastInteractionTime > IDLE_DELAY);
    if (isIdling && !filterCat) {
      rotationOffset += ROTATION_SPEED;
      layoutCatCenters(width, height, rotationOffset);
      updateCatBubbles();
    }

    var totalV = 0;
    var i, j, node, other, dx, dy, dist, minDist, force, nx, ny;
    var len = nodes.length;

    for (i = 0; i < len; i++) {
      node = nodes[i];

      /* Smooth radius transition */
      node.radius += (node.targetRadius - node.radius) * 0.12;

      /* Expanded node: lock at viewport center, let physics push others away */
      if (node.expanded) {
        node.x = centerX;
        node.y = centerY;
        node.vx = 0;
        node.vy = 0;
        continue;
      }

      /* Hidden node (filter mode): skip all physics */
      if (node.hidden) continue;

      if (filterCat) {
        /* Ring attraction: pull nodes toward a ring at ~36% of viewport min-dim */
        var fillR = Math.min(width, height) * 0.36;
        dx = node.x - centerX;
        dy = node.y - centerY;
        dist = Math.sqrt(dx * dx + dy * dy) || 0.001;
        var radErr = dist - fillR;
        node.vx -= (dx / dist) * radErr * 0.003;
        node.vy -= (dy / dist) * radErr * 0.003;
        /* Idle orbital rotation: tangential nudge to orbit the ring clockwise */
        if (isIdling) {
          node.vx -= dy * ROTATION_SPEED * 0.12;
          node.vy += dx * ROTATION_SPEED * 0.12;
        }
      } else {
        /* Per-category center gravity */
        var cc = catCenters[node.career.cat];
        dx = cc.x - node.x;
        dy = cc.y - node.y;
        node.vx += dx * 0.0012;
        node.vy += dy * 0.0012;

        /* Weak global center pull (keeps everything from drifting) */
        dx = centerX - node.x;
        dy = centerY - node.y;
        node.vx += dx * 0.00008;
        node.vy += dy * 0.00008;
      }

      /* Collision + repulsion */
      for (j = i + 1; j < len; j++) {
        other = nodes[j];
        if (other.hidden) continue;
        dx = node.x - other.x;
        dy = node.y - other.y;
        dist = Math.sqrt(dx * dx + dy * dy);
        minDist = node.radius + other.radius + PAD;

        if (dist < minDist * 2.0 && dist > 0.1) {
          nx = dx / dist;
          ny = dy / dist;
          if (dist < minDist) {
            force = (minDist - dist) * 0.12;
          } else {
            force = 0.3 / (dist * dist) * minDist;
          }
          node.vx  += nx * force;
          node.vy  += ny * force;
          other.vx -= nx * force;
          other.vy -= ny * force;
        }
      }

      /* Category bubble collision — only when not filtering (labels are hidden) */
      if (!filterCat) {
        var catKeys = CAT_ORDER;
        for (j = 0; j < catKeys.length; j++) {
          var ccPos = catCenters[catKeys[j]];
          dx = node.x - ccPos.x;
          dy = node.y - ccPos.y;
          dist = Math.sqrt(dx * dx + dy * dy);
          minDist = node.radius + CAT_R + PAD;
          if (dist < minDist && dist > 0.1) {
            nx = dx / dist;
            ny = dy / dist;
            force = (minDist - dist) / dist * 0.4;
            node.vx += nx * force;
            node.vy += ny * force;
          }
        }
      }

      /* Boundary */
      var margin = node.radius + 4;
      if (node.x < margin)          node.vx += (margin - node.x) * 0.1;
      if (node.x > width - margin)  node.vx += (width - margin - node.x) * 0.1;
      if (node.y < margin)          node.vy += (margin - node.y) * 0.1;
      if (node.y > height - margin) node.vy += (height - margin - node.y) * 0.1;

      /* Damping */
      node.vx *= 0.88;
      node.vy *= 0.88;

      totalV += Math.abs(node.vx) + Math.abs(node.vy);

      /* Update position */
      node.x += node.vx;
      node.y += node.vy;
    }

    updatePositions();

    if (totalV < 0.1 && !expandedNode && !isIdling) {
      settled = true;
      running = false;
      return;
    }

    requestAnimationFrame(simulate);
  }

  function updatePositions() {
    for (var i = 0; i < nodes.length; i++) {
      if (nodes[i].expanded) continue; // CSS transition owns this node's transform
      nodes[i].el.style.transform = 'translate(' + nodes[i].x.toFixed(1) + 'px,' + nodes[i].y.toFixed(1) + 'px) translate(-50%,-50%)';
    }
  }

  function kick(alpha) {
    settled = false;
    if (!running) {
      running = true;
      requestAnimationFrame(simulate);
    }
    if (alpha) {
      for (var i = 0; i < nodes.length; i++) {
        nodes[i].vx += (Math.random() - 0.5) * alpha;
        nodes[i].vy += (Math.random() - 0.5) * alpha;
      }
    }
  }

  /* ── Expand / Collapse ── */
  function expand(node) {
    if (expandedNode === node) {
      collapseExpanded();
      return;
    }
    if (expandedNode) collapseExpanded(true);

    expandedNode = node;
    node.expanded = true;
    node.targetRadius = EXPANDED_R;
    node.vx = 0;
    node.vy = 0;
    node.bubble.classList.add('expanded');
    node.el.classList.add('is-expanded', 'card-moving');
    overlay.classList.add('active');
    setCatLabelVisible(node.career.cat, false);

    // Double rAF: let the browser register the current transform as the
    // transition start point, then set the center target.
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        node.el.style.transform =
          'translate(' + centerX.toFixed(1) + 'px,' + centerY.toFixed(1) + 'px) translate(-50%,-50%)';
      });
    });

    // Remove the transition class once the fly-in completes
    node.el.addEventListener('transitionend', function onEnd(e) {
      if (e.target !== node.el || e.propertyName !== 'transform') return;
      node.el.removeEventListener('transitionend', onEnd);
      if (node.expanded) node.el.classList.remove('card-moving');
    });

    kick(1.5);
  }

  function collapseExpanded(silent) {
    if (!expandedNode) return;
    var node = expandedNode;
    var cat = node.career.cat;
    expandedNode = null;
    node.expanded = false;
    node.targetRadius = filterNormalR !== null ? filterNormalR : NORMAL_R;
    node.bubble.classList.remove('expanded');
    // Remove both classes — card-moving transition ends here; physics takes over
    node.el.classList.remove('is-expanded', 'card-moving');
    if (!silent) overlay.classList.remove('active');
    // Restore category label unless the user is still hovering that cluster
    if (catHoverCount[cat] === 0 && !filterCat) setCatLabelVisible(cat, true);
    // node.x/node.y = centerX/centerY (maintained by simulate while expanded).
    // Cluster gravity now pulls the node back to its category center.
    kick(1.5);
  }

  /* ── Category Label Visibility ── */
  function setCatLabelVisible(cat, visible) {
    var el = catBubbleEls[cat];
    if (!el) return;
    if (visible) {
      el.classList.remove('cat-hidden');
    } else {
      el.classList.add('cat-hidden');
    }
  }

  /* ── Category Filter ── */
  function setFilter(cat) {
    markInteraction();

    if (filterCat === cat) {
      filterCat = null;
    } else {
      if (expandedNode && expandedNode.career.cat !== cat) {
        collapseExpanded(true);
        overlay.classList.remove('active');
      }
      filterCat = cat;
    }

    nodes.forEach(function(node) {
      node.hidden = filterCat !== null && node.career.cat !== filterCat;
      if (node.hidden) {
        node.el.classList.add('is-hidden');
      } else {
        node.el.classList.remove('is-hidden');
      }
    });

    /* Disperse visible nodes to evenly-spaced positions around the ring */
    if (filterCat) {
      var fillR = Math.min(width, height) * 0.36;
      var visibleNodes = nodes.filter(function(n) { return !n.hidden; });
      /* Scale bubbles up to fill the ring efficiently */
      filterNormalR = Math.max(NORMAL_R, Math.min(NORMAL_R * 3,
        Math.round(Math.PI * fillR / (visibleNodes.length * 1.3))));
      document.documentElement.style.setProperty('--bubble-size', (filterNormalR * 2) + 'px');
      visibleNodes.forEach(function(node, i) {
        node.targetRadius = filterNormalR;
        var angle = (2 * Math.PI * i / visibleNodes.length) - Math.PI / 2;
        var tx = centerX + fillR * Math.cos(angle);
        var ty = centerY + fillR * Math.sin(angle);
        node.vx += (tx - node.x) * 0.12;
        node.vy += (ty - node.y) * 0.12;
      });
    } else {
      filterNormalR = null;
      document.documentElement.style.setProperty('--bubble-size', (NORMAL_R * 2) + 'px');
      nodes.forEach(function(n) {
        if (!n.expanded) n.targetRadius = NORMAL_R;
      });
    }

    document.querySelectorAll('.cat-filter-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.cat === filterCat);
    });

    CAT_ORDER.forEach(function(c) {
      if (filterCat) {
        setCatLabelVisible(c, false);
      } else {
        var labelVisible = catHoverCount[c] === 0 &&
          !(expandedNode && expandedNode.career.cat === c);
        setCatLabelVisible(c, labelVisible);
      }
    });

    kick(2);
  }

  /* ── Events ── */
  function markInteraction() {
    lastInteractionTime = Date.now();
  }

  function attachEvents() {
    /* Initialise per-category hover counters */
    CAT_ORDER.forEach(function(cat) { catHoverCount[cat] = 0; });
    nodes.forEach(function(node) {
      node.bubble.addEventListener('click', function(e) {
        e.stopPropagation();
        markInteraction();
        expand(node);
      });
      node.bubble.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          markInteraction();
          expand(node);
        }
      });
      if (hasHover) {
        node.bubble.addEventListener('mouseenter', function() {
          hoverCount++;
          catHoverCount[node.career.cat]++;
          markInteraction();
          setCatLabelVisible(node.career.cat, false);
          if (!node.expanded) {
            node.targetRadius = filterNormalR !== null ? Math.round(filterNormalR * 1.22) : HOVER_R;
            kick(0.3);
          }
        });
        node.bubble.addEventListener('mouseleave', function() {
          hoverCount = Math.max(0, hoverCount - 1);
          catHoverCount[node.career.cat] = Math.max(0, catHoverCount[node.career.cat] - 1);
          markInteraction();
          /* Restore label only if no other bubble in this cat is hovered
             and no card from this cat is open */
          var catStillActive = catHoverCount[node.career.cat] > 0 ||
            (expandedNode && expandedNode.career.cat === node.career.cat);
          if (!catStillActive && !filterCat) setCatLabelVisible(node.career.cat, true);
          if (!node.expanded) {
            node.targetRadius = filterNormalR !== null ? filterNormalR : NORMAL_R;
            kick(0.2);
          }
        });
      }
    });

    overlay.addEventListener('click', function() {
      markInteraction();
      collapseExpanded();
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') { markInteraction(); collapseExpanded(); }
    });

    container.addEventListener('touchstart', function() { markInteraction(); }, { passive: true });

    document.querySelectorAll('.cat-filter-btn').forEach(function(btn) {
      btn.addEventListener('click', function() { setFilter(btn.dataset.cat); });
    });

    var resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(handleResize, 200);
    });
  }

  /* ── Idle Checker — restarts simulation when rotation becomes due ── */
  function idleChecker() {
    var now = Date.now();
    var shouldRotate = !expandedNode && hoverCount === 0 && (now - lastInteractionTime > IDLE_DELAY);
    if (shouldRotate && !running) {
      kick(0); // restart physics loop; simulate() will advance rotationOffset
    }
    requestAnimationFrame(idleChecker);
  }

  function handleResize() {
    var rect = container.getBoundingClientRect();
    var oldW = width, oldH = height;
    width   = rect.width;
    height  = rect.height;
    centerX = width / 2;
    centerY = height / 2;

    calcSizes(width, height);
    layoutCatCenters(width, height);
    updateCatBubbles();

    /* Recompute filter radius after resize since viewport dims changed */
    if (filterCat) {
      var fillR = Math.min(width, height) * 0.36;
      var visN = nodes.filter(function(n) { return !n.hidden; }).length;
      filterNormalR = Math.max(NORMAL_R, Math.min(NORMAL_R * 3,
        Math.round(Math.PI * fillR / (visN * 1.3))));
      document.documentElement.style.setProperty('--bubble-size', (filterNormalR * 2) + 'px');
    }

    var scaleX = width / oldW;
    var scaleY = height / oldH;
    nodes.forEach(function(node) {
      if (node.expanded) {
        // Snap expanded card to new center immediately
        node.x = centerX;
        node.y = centerY;
        node.el.style.transform =
          'translate(' + centerX.toFixed(1) + 'px,' + centerY.toFixed(1) + 'px) translate(-50%,-50%)';
      } else {
        node.x *= scaleX;
        node.y *= scaleY;
        node.targetRadius = filterNormalR !== null && !node.hidden ? filterNormalR : NORMAL_R;
      }
    });

    kick(0.8);
  }

  /* ── Start ── */
  function init() {
    lastInteractionTime = Date.now(); // prevent rotation on cold start
    initNodes();
    attachEvents();
    kick(2.5);
    requestAnimationFrame(idleChecker);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
